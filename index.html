<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webex Video Widget - Test Page</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #333;
      margin-top: 0;
    }
    .info {
      background: #f0f7ff;
      padding: 15px;
      border-left: 4px solid #007aa3;
      margin: 20px 0;
      border-radius: 4px;
    }
    webex-video-widget {
      display: block;
      width: 100%;
      height: 700px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      margin-top: 20px;
    }
    .status {
      margin-top: 15px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 4px;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Webex Video Widget - Test Page</h1>
    
    <div class="info">
      <strong>Note:</strong> This is a standalone test page. The widget is designed to work within 
      Webex Contact Center Agent Desktop. Some features (like Desktop SDK integration) won't work here.
    </div>

    <div class="status">
      Widget loaded successfully! Check below to see it render.
    </div>

    <!-- Your widget will render here -->
    <webex-video-widget></webex-video-widget>
  </div>

  <!-- Load your widget module -->
  <script type="module" src="./webex-video-widget.es.js"></script>
  
  <script>
    // Check if widget loaded
    window.addEventListener('load', () => {
      const widget = document.querySelector('webex-video-widget');
      if (widget) {
        console.log('Widget element found in DOM');
      } else {
        console.error('Widget element not found');
      }
    });
  </script>
</body>
</html>
